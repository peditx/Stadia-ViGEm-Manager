[package]
name = "stadia-vigem-manager"
version = "2.2.0"
description = "Stadia controller -> Xbox 360 (ViGEm) manager for Windows"
authors = ["peditx"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "stadia_vigem_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[target.'cfg(target_os = "windows")'.dependencies]
vigem-client = { version = "0.1.4", features = ["unstable_xtarget_notification"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
# unwind (the default), not abort: one panicking worker thread must not take
# the whole app — window, tray, HID pump — down with it.
