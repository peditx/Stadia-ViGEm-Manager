<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stadia Remote</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #0b0c10; color: #e5e7eb; min-height: 100vh; }
    .container { max-width: 420px; margin: 0 auto; padding: 16px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    h1 { font-size: 20px; font-weight: 500; margin: 0; }
    .status-badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
    .status-connected { background: #1a3a2a; color: #4ade80; border: 1px solid #4ade8040; }
    .status-disconnected { background: #3a1a1a; color: #f87171; border: 1px solid #f8717140; }
    .tab-bar { display: flex; gap: 4px; background: #15171c; border: 1px solid #ffffff1a; border-radius: 12px; padding: 4px; margin-bottom: 16px; }
    .tab { flex: 1; padding: 10px 8px; border-radius: 8px; font-size: 13px; font-weight: 500; color: #9ca3af; background: transparent; border: none; cursor: pointer; }
    .tab.active { background: #1f2937; color: #e5e7eb; }
    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.15s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .card { background: #15171c; border: 1px solid #ffffff1a; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .card-title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #9ca3af; margin-bottom: 12px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .row:last-child { margin-bottom: 0; }
    .label { font-size: 14px; color: #e5e7eb; }
    .value { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; color: #9ca3af; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; transition: opacity 0.1s; }
    .btn:active { opacity: 0.7; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-secondary { background: #374151; color: #e5e7eb; }
    .btn-danger { background: #dc2626; color: #fff; }
    .switch { position: relative; width: 52px; height: 28px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #374151; border: 2px solid #6b7280; border-radius: 28px; transition: .2s; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 2px; bottom: 2px; background: #9ca3af; border-radius: 50%; transition: .2s; }
    input:checked + .slider { background: var(--m3-primary, #44d62c); border-color: var(--m3-primary, #44d62c); }
    input:checked + .slider:before { transform: translateX(24px); background: var(--m3-on-primary, #0a1f06); }
    .slider.round { border-radius: 28px; }
    .slider.round:before { border-radius: 50%; }
    .input { width: 100%; padding: 12px; border: 1px solid #ffffff1a; border-radius: 8px; background: #0b0c10; color: #e5e7eb; font-family: monospace; font-size: 13px; outline: none; }
    .input:focus { border-color: var(--m3-primary, #44d62c); }
    .hint { font-size: 11px; color: #6b7280; margin-top: 6px; }
    .pair-panel { text-align: center; padding: 24px; }
    .pair-panel h2 { font-size: 16px; margin: 0 0 8px; }
    .pair-panel p { font-size: 13px; color: #9ca3af; margin: 0 0 16px; }
    .token-display { background: #0b0c10; border: 1px solid #ffffff1a; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 12px; word-break: break-all; margin-bottom: 12px; }
    .macro-list { display: flex; flex-direction: column; gap: 8px; }
    .macro-btn { text-align: left; padding: 12px; background: #0b0c10; border: 1px solid #ffffff1a; border-radius: 8px; color: #e5e7eb; font-size: 13px; cursor: pointer; }
    .macro-btn:active { background: #1f2937; }
    .driver-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px; background: #0b0c10; border: 1px solid #ffffff1a; border-radius: 8px; margin-bottom: 8px; }
    .driver-row:last-child { margin-bottom: 0; }
    .driver-info { display: flex; align-items: center; gap: 10px; }
    .driver-dot { width: 8px; height: 8px; border-radius: 50%; }
    .driver-dot.ok { background: #4ade80; }
    .driver-dot.missing { background: #f87171; }
    .driver-name { font-size: 13px; font-weight: 500; }
    .driver-btn { padding: 8px 14px; font-size: 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: 500; }
    .driver-btn.install { background: #2563eb; color: #fff; }
    .driver-btn.reinstall { background: #374151; color: #e5e7eb; }
    .driver-btn.uninstall { background: #dc2626; color: #fff; }
    .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); padding: 12px 20px; border-radius: 8px; font-size: 13px; font-weight: 500; z-index: 1000; animation: slideUp 0.2s ease; }
    .toast.success { background: #1a3a2a; color: #4ade80; border: 1px solid #4ade8040; }
    .toast.error { background: #3a1a1a; color: #f87171; border: 1px solid #f8717140; }
    @keyframes slideUp { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Stadia Remote</h1>
      <span id="connBadge" class="status-badge status-disconnected">Disconnected</span>
    </header>

    <div class="tab-bar">
      <button class="tab active" data-tab="status">Status</button>
      <button class="tab" data-tab="controls">Controls</button>
      <button class="tab" data-tab="drivers">Drivers</button>
    </div>

    <!-- Pairing screen (shown when no token) -->
    <div id="pairScreen" class="hidden">
      <div class="pair-panel">
        <h2>Pair with desktop app</h2>
        <p>Open the Remote Access tab in the desktop app and scan the QR code or copy the URL with the token.</p>
        <div id="pairToken" class="token-display"></div>
        <button class="btn btn-primary" onclick="copyToken()">Copy Pairing URL</button>
      </div>
    </div>

    <!-- Main app (shown after token verified) -->
    <div id="mainApp" class="hidden">
      <!-- Status Tab -->
      <div id="tab-status" class="tab-content active">
        <div class="card">
          <div class="card-title">Controller</div>
          <div class="row"><span class="label">Connection</span><span id="connType" class="value">—</span></div>
          <div class="row"><span class="label">Battery</span><span id="battery" class="value">—</span></div>
          <div class="row"><span class="label">Devices</span><span id="devCount" class="value">0</span></div>
        </div>
        <div class="card">
          <div class="card-title">Server</div>
          <div class="row"><span class="label">Local IP</span><span id="localIp" class="value">—</span></div>
          <div class="row"><span class="label">Port</span><span id="port" class="value">—</span></div>
        </div>
      </div>

      <!-- Controls Tab -->
      <div id="tab-controls" class="tab-content">
        <div class="card">
          <div class="card-title">Vibration</div>
          <div class="row">
            <span class="label">Strength</span>
            <input type="range" id="rumbleStrength" min="0" max="100" value="100" style="flex:1;max-width:200px;">
            <span id="rumbleValue" class="value">100%</span>
          </div>
        </div>
        <div class="card">
          <button class="btn btn-primary" id="rumbleBtn">Trigger Rumble</button>
        </div>
        <div class="card">
          <div class="card-title">Macros</div>
          <div id="macroList" class="macro-list"></div>
        </div>
      </div>

      <!-- Drivers Tab -->
      <div id="tab-drivers" class="tab-content">
        <div class="card">
          <div class="card-title">Driver Status</div>
          <div id="driverList"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Token handling
    const urlHash = location.hash.slice(1);
    let token = urlHash || localStorage.getItem('stadia-token');
    const API_BASE = '';

    function showToast(msg, type = 'info') {
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 200); }, 3000);
    }

    function setAuthHeader(headers) {
      if (token) headers['Authorization'] = `Bearer ${token}`;
    }

    async function api(method, path, body) {
      const headers = { 'Content-Type': 'application/json' };
      setAuthHeader(headers);
      const res = await fetch(API_BASE + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
      if (res.status === 401) { showPairScreen(); throw new Error('Unauthorized'); }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    function showPairScreen() {
      document.getElementById('pairScreen').classList.remove('hidden');
      document.getElementById('mainApp').classList.add('hidden');
      if (token) {
        document.getElementById('pairToken').textContent = location.origin + location.pathname + '#' + token;
      }
    }

    function showMainApp() {
      document.getElementById('pairScreen').classList.add('hidden');
      document.getElementById('mainApp').classList.remove('hidden');
    }

    function copyToken() {
      const url = location.origin + location.pathname + '#' + token;
      navigator.clipboard.writeText(url).then(() => showToast('Copied', 'success'));
    }

    // Tabs
    document.querySelectorAll('.tab').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      };
    });

    // Rumble strength slider
    const rumbleSlider = document.getElementById('rumbleStrength');
    const rumbleValue = document.getElementById('rumbleValue');
    rumbleSlider.oninput = () => { rumbleValue.textContent = rumbleSlider.value + '%'; };

    // Rumble button
    document.getElementById('rumbleBtn').onclick = async () => {
      try {
        await api('POST', '/api/rumble', { strength: parseInt(rumbleSlider.value) });
        showToast('Rumble sent', 'success');
      } catch (e) { showToast(e.message, 'error'); }
    };

    // Load macros
    async function loadMacros() {
      try {
        const cfg = await api('GET', '/api/config');
        const list = document.getElementById('macroList');
        list.innerHTML = '';
        if (cfg.macros && cfg.macros.length) {
          cfg.macros.forEach(m => {
            const btn = document.createElement('button');
            btn.className = 'macro-btn';
            btn.textContent = m.name;
            btn.onclick = () => runMacro(m.id);
            list.appendChild(btn);
          });
        } else {
          list.innerHTML = '<div class="hint">No macros configured</div>';
        }
      } catch (e) {}
    }

    async function runMacro(id) {
      try {
        await api('POST', '/api/macro/' + id);
        showToast('Macro started', 'success');
      } catch (e) { showToast(e.message, 'error'); }
    }

    // Load drivers
    async function loadDrivers() {
      try {
        const status = await api('GET', '/api/status');
        const list = document.getElementById('driverList');
        const drivers = [
          { key: 'vigemBus', name: 'ViGEmBus Driver', installed: status.vigemBus },
          { key: 'hidHide', name: 'HidHide Driver', installed: status.hidHide },
          { key: 'driverCore', name: 'Stadia Core', installed: status.driverCore },
        ];
        list.innerHTML = '';
        drivers.forEach(d => {
          const row = document.createElement('div');
          row.className = 'driver-row';
          row.innerHTML = `
            <div class="driver-info">
              <span class="driver-dot ${d.installed ? 'ok' : 'missing'}"></span>
              <span class="driver-name">${d.name}</span>
            </div>
            <button class="driver-btn ${d.installed ? 'reinstall' : 'install'}" data-driver="${d.key}" data-action="${d.installed ? 'reinstall' : 'install'}">
              ${d.installed ? 'Reinstall' : 'Install'}
            </button>
          `;
          list.appendChild(row);
        });
        list.querySelectorAll('.driver-btn').forEach(btn => {
          btn.onclick = async () => {
            const driver = btn.dataset.driver;
            const action = btn.dataset.action;
            try {
              await api('POST', '/api/driver/' + driver + '/' + action);
              showToast(`${driver} ${action} started`, 'success');
              setTimeout(loadDrivers, 3000);
            } catch (e) { showToast(e.message, 'error'); }
          };
        });
      } catch (e) {}
    }

    // Status polling
    async function pollStatus() {
      try {
        const s = await api('GET', '/api/status');
        document.getElementById('connBadge').className = 'status-badge ' + (s.controller === 'connected' ? 'status-connected' : 'status-disconnected');
        document.getElementById('connBadge').textContent = s.controller === 'connected' ? 'Connected' : 'Disconnected';
        document.getElementById('connType').textContent = s.connection || '—';
        document.getElementById('battery').textContent = s.battery >= 0 ? s.battery + '%' : (s.controller === 'connected' ? 'Unknown' : '—');
        document.getElementById('devCount').textContent = s.deviceCount || 0;
        document.getElementById('localIp').textContent = s.localIp || '—';
        document.getElementById('port').textContent = s.port || '—';
      } catch (e) {}
    }

    // Auth check on load
    async function checkAuth() {
      if (!token) { showPairScreen(); return; }
      try {
        await api('GET', '/api/config');
        localStorage.setItem('stadia-token', token);
        history.replaceState(null, '', location.pathname); // clear hash
        showMainApp();
        loadMacros();
        loadDrivers();
        pollStatus();
        setInterval(pollStatus, 2000);
      } catch (e) {
        showPairScreen();
      }
    }

    checkAuth();
  </script>
</body>
</html>
